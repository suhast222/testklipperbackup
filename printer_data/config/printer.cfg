 # This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[pause_resume]

[include timelapse.cfg]

[include adxl345.cfg]

[input_shaper]
shaper_type_x = mzv
shaper_freq_x = 0
shaper_type_y = mzv
shaper_freq-y = 0

[exclude_object]

# Enable arcs support
[gcode_arcs]
resolution: 0.1

[firmware_retraction]
 retract_length: 1 #6
 retract_speed: 45 #25
 unretract_extra_length: 1
 unretract_speed: 10
 
 # KlackEnder- Settings
#####################################################################
[include KlackEnder.cfg]
# !! Change your Z endstop pin from 'endstop_pin: Pin123' to 'endstop_pin: probe:z_virtual_endstop'
# !! Also add in [stepper_y] 'position_min: -8'. Idk why but most configs have this wrong. For the Stock Ender 3 the homed Y position is -8.

[probe]
pin: ^PC2 #Change to where you plug your probe in, endstop or probe pin pulled high (^)
#z_offset: 0 #Measure per your specific setup. Klipper will NOT save this value if this in not located in printer.cfg
x_offset: 4 # negative = left of the nozzle
y_offset: 21 # negative = in front of of the nozzle
speed: 5.0
lift_speed: 15.0
sample_retract_dist: 1
samples: 2
samples_tolerance_retries: 6

[bed_mesh]
speed: 300
horizontal_move_z: 5 #Positive value equal to z_offset or larger. eg: if z_offset is -2.5 this must be at least 2.5 or larger
mesh_min: 8,30
mesh_max: 223,201
probe_count: 5,5
zero_reference_position: 117.5, 117.5 #for 235x235 bed. adapt to your bed size if needed. same for mesh min and max above
algorithm: bicubic
fade_start: 1
fade_end: 10
#fade_target:
#   The z position in which fade should converge. When this value is set
#   to a non-zero value it must be within the range of z-values in the mesh.
#   Users that wish to converge to the z homing position should set this to 0.
#   Default is the average z value of the mesh.
split_delta_z: 0.015
#   The amount of Z difference (in mm) along a move that will
#   trigger a split. Default is .025.
move_check_distance: 3
#   The distance (in mm) along a move to check for split_delta_z.
#   This is also the minimum length that a move can be split. Default
#   is 5.0.
mesh_pps: 4,4
#   A comma separated pair of integers (X,Y) defining the number of
#   points per segment to interpolate in the mesh along each axis. A
#   "segment" can be defined as the space between each probed
#   point. The user may enter a single value which will be applied
#   to both axes.  Default is 2,2.
bicubic_tension: .2
#   When using the bicubic algorithm the tension parameter above
#   may be applied to change the amount of slope interpolated.
#   Larger numbers will increase the amount of slope, which
#   results in more curvature in the mesh. Default is .2.

[homing_override]
set_position_z:0 # Make printer think Z axis is at zero, so we can force a move upwards away from build plate
axes: z #will only call override if x is involved in the homing call
gcode:
  G90
  G1 Z10 F3000 ; move up to prevent accidentally scratching build plate    
  {% if "x" not in (printer.toolhead.homed_axes | lower) %}
      G28 X
  {% endif %}
  {% if "y" not in (printer.toolhead.homed_axes | lower) %}
      G28 Y        #Will only home XY if they are not currently homed
  {% endif %}
  PROBE_OUT
  G1 X113.5 Y96.5 F6000 ; Adjusted for normal klack offsets with a 235x235 bed X: 117.5 - x_offset, Y: 117.5 - y_offset
  G28 Z
  PROBE_IN
  
[screws_tilt_adjust] #Change to your specific printer is needed. Back left screw as referance point and that's where strain relief is is recommended
screw1: 28.5, 181.5
screw1_name: Back left
screw2: 28.5, 11.5
screw2_name: Front left
screw3: 198.5, 11.5
screw3_name: Front right
screw4: 198.5, 181.5
screw4_name: Back right
screw_thread: CW-M4 #Ender 3s use CW-M4 change for your printer if needed
horizontal_move_z: 10
# To calculate the position of your screws:
# Screw Offsets: 32.5mm for ender 3 beds
# Default Klack probe offsets: X: 4, Y: 21
#Back left	
#   X: 0 + screw_x_offset - probe.x_offset	
#   Y: 235 - screw_y_offset - probe.y_offset
#Front left	
#   X: 0 + screw_x_offset - probe.x_offset	
#   Y: 0 + screw_y_offset - probe.y_offset
#Front right 
#   X: 235 - screw_x_offset - probe.x_offset	
#   Y: 0 + screw_y_offset - probe.y_offset
#Back right	
#   X: 235 - screw_x_offset - probe.x_offset	
#   Y: 235 - screw_y_offset - probe.y_offset
# x and y offsets are usually the same. You will have to find info on your printer or measure them yourself
# This can be adapted for three screw bed as well without eny problem. In that case X offset of the third screw would be build volume divided by 2

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: _SCREWS_TILT_CALCULATE
gcode:
  G28 ; Should always home before calculation even if already homed
  probe_out
  _SCREWS_TILT_CALCULATE
  probe_in
 

[include KAMP_Settings.cfg]
  
#[gcode_macro START_PRINT]
#description: Prepare the printer for printing with KAMP functionality
#gcode:
    # Get parameters
  #  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
#    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
 
    # Home if not already homed
  #  {% if not 'xyz' in printer.toolhead.homed_axes %}
  #      G28                           ; Home all axes
#   {% endif %}
 
    # Start heating the bed, don't wait
   # M140 S{BED_TEMP}                  ; Start heating bed
 
    # Use SMART_PARK to wait near the print area
  #  Smart_Park                       ; Park near print area at a comfortable Z height
 
    # Wait for bed to reach temp
#   M190 S{BED_TEMP}                  ; Wait for bed to reach temperature
 
    # Start heating the extruder
  #  M104 S{EXTRUDER_TEMP}             ; Start heating extruder
 
   # # Run Adaptive Mesh Leveling
   # BED_MESH_CALIBRATE                ; KAMP adaptive mesh
  #   BED_MESH_CALIBRATE ADAPTIVE=1
    # Wait for extruder to reach temp
 #   M109 S{EXTRUDER_TEMP}             ; Wait for extruder to reach temperature
 
    # Purge line using Voron purge
 #   Line_Purge                       ; KAMP adaptive purge

[gcode_macro START_PRINT]
gcode:
    # 1. Get Parameters
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
 
    # 2. Homing and Initial Heating
    G28                           ; Home all axes
    M190 S{BED_TEMP}              ; Wait for bed to reach temperature
 
    # 3. Klipper Native Adaptive Mesh
    # This will automatically pick up the Klackender if macros are set correctly
    BED_MESH_CALIBRATE ADAPTIVE=1 
 
    # 4. Smart Park and Final Nozzle Heat
    # Move near the print area to save time and avoid oozing across the bed
    SMART_PARK                   
    M109 S{EXTRUDER_TEMP}         ; Wait for extruder to reach temperature
 
    # 5. KAMP Adaptive Purge
    Line_Purge                  



    
# [gcode_macro END_PRINT]
# description: Actions to perform after a print has completed
# gcode:
    # Get parameter for filament retraction distance
  #  {% set retract_dist = printer["gcode_macro _KAMP_Settings"].tip_distance|default(5)|float %}
 
    # Turn off bed, extruder, and fan
  #  M140 S0                           ; Turn off bed
  #  M104 S0                           ; Turn off extruder
  #  M106 S0                           ; Turn off part cooling fan
 
    # Retract filament
  #  G91                               ; Relative positioning
  #  G1 E-{retract_dist} F2700         ; Retract filament to prevent oozing
 
    # Park the head
 #   G90                               ; Absolute positioning
  #  G1 Z{printer.toolhead.position.z + 10} F3000 ; Move Z up by 10mm
  #  G1 X0 Y{printer.toolhead.axis_maximum.y} F3000 ; Park at back of printer
 
    # Disable motors
  #  M84                               ; Disable motors

[gcode_macro END_PRINT]
description: Safe actions for Z-Belt and Klackender
gcode:
    # 1. Get KAMP retraction parameter
    {% set retract_dist = printer["gcode_macro _KAMP_Settings"].tip_distance|default(5)|float %}
 
    # 2. Thermal and fan shutdown
    M140 S0                           ; Turn off bed
    M104 S0                           ; Turn off extruder
    M106 S0                           ; Turn off part cooling fan
 
    # 3. Retract and quick lift (Relative)
    G91                               ; Relative positioning
    G1 E-{retract_dist} F2700         ; Retract filament (KAMP distance)
    G1 Z10 F600                       ; Immediate 10mm lift
 
    # 4. Safe Parking (Absolute)
    G90                               ; Absolute positioning
    G1 X10 Y200 F3000                 ; Move X away and bring BED FORWARD to Y200
                                      ; (Change Y200 to Y180 if it still vibrates)
 
    # 5. Z-Belt Safety Height (Lifts to 80mm if the print was low)
    {% if printer.toolhead.position.z < 80 %}
        G1 Z80 F600               
    {% endif %}
 
    # 6. SELECTIVE MOTOR DISABLE (CRUCIAL for Z-Belt Mod)
    # We do NOT use M84 because it would drop the Z axis.
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    # Stepper Z remains ENABLED to hold the gantry up
    
    # 7. Final cleanup
    SET_GCODE_OFFSET Z=0
    M117 Print Finished

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
  _TOOLHEAD_PARK_PAUSE_CANCEL

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read extrude from  _TOOLHEAD_PARK_PAUSE_CANCEL  macro #####
  {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  ## Move head and retract only if not already in the pause state and park set to true
  {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true'%}
    _TOOLHEAD_PARK_PAUSE_CANCEL
  {% endif %}
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
variable_extrude: 1.0
gcode:
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set z_park_delta = 2.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - z_park_delta) %}
    {% set z_safe = z_park_delta %}
  {% else %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    M83
    G1 E-{extrude} F2100
    {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
    {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}

