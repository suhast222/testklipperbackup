# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication/USART.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

#[bltouch]
#sensor_pin: ^PC14
#control_pin: PA1
#x_offset: -48.2
#y_offset: -8
##speed:

#[safe_z_home]
#home_xy_position: 117.5,117.5 # Change coordinates to the center of your print bed
#speed: 50
#z_hop: 10                 # Move up 10mm
#z_hop_speed: 5

[bed_mesh]
#adaptive_margin: 5
speed: 120
horizontal_move_z: 7
mesh_min: 30, 30
mesh_max: 200, 195 #200 195
probe_count: 5, 4
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2


[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 240 # 260 para bed leveling
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
hold_current: 0.500
stealthchop_threshold: 999999
diag_pin: PC0

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: -8
position_min: -8
position_max: 230 # 260 para bed leveling
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.080
hold_current: 0.500
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
# endstop_pin: ^PC2
# position_endstop: 0.0
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -5

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
hold_current: 0.500
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 7.64
full_steps_per_rotation: 200 
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PA0
#control: pid
#pid_Kp: 20.269
#pid_Ki: 1.325
#pid_Kd: 77.531
min_temp: 0
max_temp: 320
max_extrude_only_distance: 100
pressure_advance = 0.015
max_extrude_cross_section: 5  # Required for KAMP to purge (default: 2)

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
hold_current: 0.500
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: Generic 3950 #ATC Semitec 104GT-2
sensor_pin: PC4
#control: pid
#pid_Kp: 70.809
#pid_Ki: 1.319
#pid_Kd: 950.608
min_temp: 0
max_temp: 110


[heater_fan nozzle_cooling_fan]
pin: PC7

[fan]
pin: PC6

[temperature_fan Pi]
pin: PB15
sensor_type: temperature_host
min_temp: 10
max_temp: 85
target_temp: 45.0             # Fan starts at 45°C
control: watermark
max_delta: 3.0
shutdown_speed: 1.0           # Full speed if Klipper crashes

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_5B003F0011504D5930313820-if00



# serial: /dev/ttyAMA0
# restart_method: command

[printer]
kinematics: cartesian
max_velocity: 60
max_accel: 1500
minimum_cruise_ratio: 0.5
max_z_velocity: 5
max_z_accel: 100

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>




